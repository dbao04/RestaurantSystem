<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Trợ lý ảo">
  <defs>
    <radialGradient id="nen" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fbe7b0"/>
      <stop offset="0.6" stop-color="#e2bd6a"/>
      <stop offset="1" stop-color="#b8893a"/>
    </radialGradient>
    <linearGradient id="toc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2418"/>
      <stop offset="1" stop-color="#1c110b"/>
    </linearGradient>
    <linearGradient id="da" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde6d3"/>
      <stop offset="1" stop-color="#f6cfb4"/>
    </linearGradient>
    <linearGradient id="ao" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b2d2d"/>
      <stop offset="1" stop-color="#6e1c1f"/>
    </linearGradient>
    <clipPath id="tron"><circle cx="50" cy="50" r="50"/></clipPath>
  </defs>
  <g clip-path="url(#tron)">
    <rect width="100" height="100" fill="url(#nen)"/>
    <!-- hoa anh dao mo phia sau -->
    <g fill="#fff" opacity=".35">
      <circle cx="16" cy="22" r="3"/><circle cx="84" cy="18" r="2.4"/><circle cx="88" cy="40" r="1.8"/><circle cx="11" cy="44" r="1.6"/>
    </g>
    <!-- bui toc -->
    <circle cx="50" cy="17" r="11" fill="url(#toc)"/>
    <!-- tram cai toc kanzashi -->
    <rect x="58" y="6" width="2.4" height="22" rx="1.2" fill="#c8a24b" transform="rotate(35 59 17)"/>
    <circle cx="64.5" cy="9.5" r="3.6" fill="#f08aa0"/>
    <circle cx="64.5" cy="9.5" r="1.4" fill="#ffd8e1"/>
    <!-- than ao kimono -->
    <path d="M14 104 C16 80 30 72 50 72 C70 72 84 80 86 104 Z" fill="url(#ao)"/>
    <path d="M38 73 L50 92 L62 73 C58 72 54 71.5 50 71.5 C46 71.5 42 72 38 73 Z" fill="#faf3e6"/>
    <path d="M41 73.5 L50 88 L59 73.5" fill="none" stroke="#c8a24b" stroke-width="1.6"/>
    <path d="M28 96 H72 V104 H28 Z" fill="#c8a24b"/>
    <!-- co -->
    <rect x="44" y="60" width="12" height="14" rx="5" fill="#f3c6a8"/>
    <!-- toc phia sau -->
    <path d="M26 44 C26 26 36 19 50 19 C64 19 74 26 74 44 L74 58 C70 54 68 52 66 50 L34 50 C32 52 30 54 26 58 Z" fill="url(#toc)"/>
    <!-- mat -->
    <ellipse cx="50" cy="46" rx="18.5" ry="20" fill="url(#da)"/>
    <!-- mai toc -->
    <path d="M31 42 C33 29 42 25 50 25 C58 25 67 29 69 42 C63 39 59 34 57 30 C53 36 44 40 31 42 Z" fill="url(#toc)"/>
    <path d="M57 30 C60 36 64 39 69 42" fill="none" stroke="#5a3a28" stroke-width=".8" opacity=".6"/>
    <!-- mat cuoi -->
    <path d="M39.5 47 Q43 43.5 46.5 47" fill="none" stroke="#2b1a12" stroke-width="2" stroke-linecap="round"/>
    <path d="M53.5 47 Q57 43.5 60.5 47" fill="none" stroke="#2b1a12" stroke-width="2" stroke-linecap="round"/>
    <!-- ma hong -->
    <ellipse cx="39" cy="53" rx="3.6" ry="2.2" fill="#f49a9a" opacity=".55"/>
    <ellipse cx="61" cy="53" rx="3.6" ry="2.2" fill="#f49a9a" opacity=".55"/>
    <!-- mieng -->
    <path d="M45.5 55.5 Q50 60 54.5 55.5" fill="#c95a5a" stroke="#a94444" stroke-width=".8" stroke-linejoin="round"/>
    <!-- tai nghe ho tro -->
    <path d="M30.5 47 C30 34 38 27 50 27 C62 27 70 34 69.5 47" fill="none" stroke="#2b1a12" stroke-width="1.8" opacity=".85"/>
    <rect x="27.5" y="44" width="5.5" height="10" rx="2.6" fill="#c8a24b" stroke="#8a6420" stroke-width=".8"/>
    <path d="M30 54 C31 60 36 62 41 61.5" fill="none" stroke="#2b1a12" stroke-width="1.3"/>
    <circle cx="41.5" cy="61.5" r="1.6" fill="#c8a24b"/>
  </g>
  <circle cx="50" cy="50" r="49" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>
</svg>
