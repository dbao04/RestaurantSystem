<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Bieu tuong tab trinh duyet - Nha Hang Bao Doan.
       Chuong dau bep (cloche) lay tu logo images/logo.svg, ve bang khoi dac
       thay vi net manh de van nhan ra o kich thuoc 16px. Mau: nen espresso
       #2b1a12, vang dong thuong hieu #d4af37. -->
  <defs>
    <linearGradient id="vang" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dc92"/>
      <stop offset=".5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#a87b22"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#2b1a12"/>
  <!-- num cam -->
  <rect x="29" y="15" width="6" height="5" rx="1.5" fill="url(#vang)"/>
  <circle cx="32" cy="14" r="4.2" fill="url(#vang)"/>
  <!-- vom chuong -->
  <path d="M10 45a22 22 0 0 1 44 0z" fill="url(#vang)"/>
  <!-- vet sang tren vom -->
  <path d="M19 37.5a14.5 14.5 0 0 1 9-10" fill="none" stroke="#2b1a12" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
  <!-- khay -->
  <rect x="6" y="47.5" width="52" height="5.5" rx="2.75" fill="url(#vang)"/>
</svg>
