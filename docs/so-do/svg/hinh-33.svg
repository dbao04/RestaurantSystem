    <text class="tx-ghi" x="20" y="906">Thời điểm trừ kho đặt ở bước bếp HOÀN THÀNH món, không phải lúc khách gọi món hay lúc thanh toán: đơn có thể bị huỷ</text><text class="tx-ghi" x="20" y="919">sau khi gọi, còn nguyên liệu thì đã thực sự tiêu hao ngay khi bếp nấu xong.</text>
  </g></svg>