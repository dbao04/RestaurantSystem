    </g><g class="hd ">
      <rect x="117.5" y="228" width="165" height="44" rx="13"/>
      <text class="tx-viec" x="200" y="247.5">Nhập từng lô: số lượng, giá,</text><text class="tx-viec" x="200" y="261.5">số lô và hạn sử dụng</text>
    </g><g class="hd ">
      <rect x="103" y="678" width="194" height="44" rx="13"/>
      <text class="tx-viec" x="200" y="697.5">Nhận cảnh báo thiếu nguyên liệu,</text><text class="tx-viec" x="200" y="711.5">nhập bù hoặc báo hết món</text>
    </g><g class="hd tu-dong">
      <rect x="513" y="228" width="224" height="44" rx="13"/>
      <text class="tx-viec" x="625" y="247.5">Ghi phieu_nhap + chi_tiet_phieu_nhap,</text><text class="tx-viec" x="625" y="261.5">cộng tồn cho nguyen_lieu</text>
    </g><g class="hd tu-dong">
      <rect x="550.5" y="408" width="149" height="44" rx="13"/>
      <text class="tx-viec" x="625" y="427.5">Cảnh báo lô sắp hết hạn</text><text class="tx-viec" x="625" y="441.5">trên dashboard tồn kho</text>
    </g><g class="hd tu-dong">
