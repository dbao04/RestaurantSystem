            markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="none" stroke="currentColor" stroke-width="1.4"/>
    </marker>
  </defs><g class="tn ">
    <circle cx="60" cy="29" r="11"/>
    <line x1="60" y1="40" x2="60" y2="66"/>
    <line x1="43" y1="49" x2="77" y2="49"/>
    <line x1="60" y1="66" x2="47" y2="88"/>
    <line x1="60" y1="66" x2="73" y2="88"/>
    <text class="tx-tn" x="60" y="106">Tác nhân</text>
  </g><g class="uc ">
    <ellipse cx="268" cy="52" rx="104" ry="26"/>
    <text class="tx-uc" x="268" y="57">Ca sử dụng</text>
  </g><g class="uc uc-phu">
    <ellipse cx="520" cy="52" rx="112" ry="26"/>
    <text class="tx-uc" x="520" y="57">Ca sử dụng được gọi</text>
  </g><g class="uc uc-ngoai">
    <ellipse cx="768" cy="52" rx="112" ry="26"/>
    <text class="tx-uc" x="768" y="57">Có gọi hệ thống ngoài</text>
  </g><line class="lk" x1="910" y1="40" x2="1030" y2="40"/><text class="tx-ghi" x="970" y="30" text-anchor="middle">liên kết</text><g class="qh">
    <line class="lk-dut" x1="910" y1="84" x2="1030" y2="84" marker-end="url(#mui-cg1)"/>
    <text class="tx-khuon" x="970" y="76">&#171;include&#187;</text>
  </g><g class="ht-ngoai"><rect x="1070" y="30" width="170" height="44" rx="3"/>
    <text class="tx-khuon" x="1155" y="48">&#171;h&#7879; th&#7889;ng ngo&#224;i&#187;</text>
    <text class="tx-ht" x="1155" y="64">T&#225;c nh&#226;n ph&#7909;</text></g></svg>