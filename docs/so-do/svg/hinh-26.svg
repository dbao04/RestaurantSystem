    <text class="tx-ghi" x="20" y="916">Tầng ④ là lớp bảo vệ quan trọng nhất: mô hình chỉ chọn MẪU câu truy vấn và điền tham số đã kiểm tra kiểu, chứ không</text><text class="tx-ghi" x="20" y="929">sinh chuỗi SQL tự do. Nhờ vậy một câu hỏi bịa đặt cũng không thể trở thành lệnh xoá dữ liệu.</text>
  </g></svg>