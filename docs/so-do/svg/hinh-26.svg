    </g><g class="hd tu-dong">
      <rect x="488.5" y="228" width="173" height="44" rx="13"/>
      <text class="tx-viec" x="575" y="247.5">Xác định quyền của người hỏi</text><text class="tx-viec" x="575" y="261.5">theo phiên đăng nhập</text>
    </g><g class="hd ">
      <rect x="491.5" y="588" width="167" height="44" rx="13"/>
