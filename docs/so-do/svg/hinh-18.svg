    <text class="tx-bien" x="835" y="56">TIẾN TRÌNH HỌC MÁY (Python / FastAPI)</text>
  </g><g class="lop "><rect class="vien" x="50" y="80" width="164" height="177" rx="3"/><rect class="ngan-ten" x="50" y="80" width="164" height="37" rx="3"/><text class="tx-khuon" x="132" y="94">&#171;module&#187;</text><text class="tx-lop-ten" x="132" y="109">mlService</text><line x1="50" y1="117" x2="214" y2="117"/><text class="tx-lop" x="61" y="129">− urlCache: string</text><text class="tx-lop" x="61" y="145">− TIMEOUT_MS = 30000</text><line x1="50" y1="155" x2="214" y2="155"/><text class="tx-lop pt" x="61" y="167">+ duBaoLuotKhach(soNgay)</text><text class="tx-lop pt" x="61" y="183">+ duBaoNguyenLieu(soNgay)</text><text class="tx-lop pt" x="61" y="199">+ khaiPhaLuat(thamSo)</text><text class="tx-lop pt" x="61" y="215">+ goiYMon(idMon, soLuong)</text><text class="tx-lop pt" x="61" y="231">+ kiemTra()</text><text class="tx-lop pt" x="61" y="247">− goi(duongDan, opts)</text></g><g class="lop "><rect class="vien" x="460" y="80" width="175" height="145" rx="3"/><rect class="ngan-ten" x="460" y="80" width="175" height="37" rx="3"/><text class="tx-khuon" x="547.5" y="94">&#171;service&#187;</text><text class="tx-lop-ten" x="547.5" y="109">ml_service/main.py</text><line x1="460" y1="117" x2="635" y2="117"/><text class="tx-lop" x="471" y="129">− app: FastAPI</text><line x1="460" y1="139" x2="635" y2="139"/><text class="tx-lop pt" x="471" y="151">+ POST /du-bao/luot-khach</text><text class="tx-lop pt" x="471" y="167">+ POST /du-bao/nguyen-lieu</text><text class="tx-lop pt" x="471" y="183">+ POST /goi-y/khai-pha</text><text class="tx-lop pt" x="471" y="199">+ POST /khuon-mat/cham-cong</text><text class="tx-lop pt" x="471" y="215">+ POST /chatbot/hoi</text></g><g class="lop "><rect class="vien" x="790" y="80" width="179" height="123" rx="3"/><rect class="ngan-ten" x="790" y="80" width="179" height="37" rx="3"/><text class="tx-khuon" x="879.5" y="94">&#171;module&#187;</text><text class="tx-lop-ten" x="879.5" y="109">forecast.py</text><line x1="790" y1="117" x2="969" y2="117"/><text class="tx-lop pt" x="801" y="129">+ du_bao_luot_khach(so_ngay)</text><text class="tx-lop pt" x="801" y="145">+ du_bao_nguyen_lieu(so_ngay)</text><text class="tx-lop pt" x="801" y="161">− _nap_chuoi_ngay()</text><text class="tx-lop pt" x="801" y="177">− _du_bao_de_quy(...)</text><text class="tx-lop pt" x="801" y="193">− _luu_du_bao_khach(...)</text></g><g class="lop "><rect class="vien" x="1060" y="80" width="172" height="129" rx="3"/><rect class="ngan-ten" x="1060" y="80" width="172" height="37" rx="3"/><text class="tx-khuon" x="1146" y="94">&#171;module&#187;</text><text class="tx-lop-ten" x="1146" y="109">models.py</text><line x1="1060" y1="117" x2="1232" y2="117"/><text class="tx-lop" x="1071" y="129">+ KetQua</text><line x1="1060" y1="139" x2="1232" y2="139"/><text class="tx-lop pt" x="1071" y="151">+ danh_sach_mo_hinh()</text><text class="tx-lop pt" x="1071" y="167">+ huan_luyen_va_danh_gia(...)</text><text class="tx-lop pt" x="1071" y="183">+ huan_luyen_lai_toan_bo(...)</text><text class="tx-lop pt" x="1071" y="199">+ tinh_chi_so(y, y_hat)</text></g><g class="lop "><rect class="vien" x="790" y="300" width="157" height="107" rx="3"/><rect class="ngan-ten" x="790" y="300" width="157" height="37" rx="3"/><text class="tx-khuon" x="868.5" y="314">&#171;module&#187;</text><text class="tx-lop-ten" x="868.5" y="329">features.py</text><line x1="790" y1="337" x2="947" y2="337"/><text class="tx-lop pt" x="801" y="349">+ chuan_bi(df, cot, ngay)</text><text class="tx-lop pt" x="801" y="365">+ cot_dac_trung(...)</text><text class="tx-lop pt" x="801" y="381">+ them_dac_trung_lich(df)</text><text class="tx-lop pt" x="801" y="397">+ them_dac_trung_tre(df)</text></g><g class="lop "><rect class="vien" x="460" y="300" width="172" height="129" rx="3"/><rect class="ngan-ten" x="460" y="300" width="172" height="37" rx="3"/><text class="tx-khuon" x="546" y="314">&#171;module&#187;</text><text class="tx-lop-ten" x="546" y="329">apriori.py</text><line x1="460" y1="337" x2="632" y2="337"/><text class="tx-lop" x="471" y="349">− min_support, min_confidence</text><line x1="460" y1="359" x2="632" y2="359"/><text class="tx-lop pt" x="471" y="371">+ khai_pha_va_luu(...)</text><text class="tx-lop pt" x="471" y="387">+ goi_y(id_mon, so_luong)</text><text class="tx-lop pt" x="471" y="403">− apriori(giao_dich)</text><text class="tx-lop pt" x="471" y="419">− sinh_luat(pho_bien)</text></g><g class="lop "><rect class="vien" x="460" y="470" width="146" height="145" rx="3"/><rect class="ngan-ten" x="460" y="470" width="146" height="37" rx="3"/><text class="tx-khuon" x="533" y="484">&#171;module&#187;</text><text class="tx-lop-ten" x="533" y="499">khuon_mat.py</text><line x1="460" y1="507" x2="606" y2="507"/><text class="tx-lop" x="471" y="519">− bo_phat_hien: YuNet</text><text class="tx-lop" x="471" y="535">− bo_trich: SFace</text><line x1="460" y1="545" x2="606" y2="545"/><text class="tx-lop pt" x="471" y="557">+ nhan_dien(khung)</text><text class="tx-lop pt" x="471" y="573">+ xac_minh(khung, id_nv)</text><text class="tx-lop pt" x="471" y="589">+ kiem_tra_song(...)</text><text class="tx-lop pt" x="471" y="605">+ dang_ky(id_nv, anh)</text></g><g class="lop "><rect class="vien" x="790" y="470" width="140" height="97" rx="3"/><rect class="ngan-ten" x="790" y="470" width="140" height="37" rx="3"/><text class="tx-khuon" x="860" y="484">&#171;module&#187;</text><text class="tx-lop-ten" x="860" y="499">chatbot/bot.py</text><line x1="790" y1="507" x2="930" y2="507"/><text class="tx-lop" x="801" y="519">− nguong_tin_cay: float</text><line x1="790" y1="529" x2="930" y2="529"/><text class="tx-lop pt" x="801" y="541">+ hoi(cau, boi_canh)</text><text class="tx-lop pt" x="801" y="557">+ trang_thai()</text></g><g class="lop "><rect class="vien" x="1060" y="470" width="140" height="97" rx="3"/><rect class="ngan-ten" x="1060" y="470" width="140" height="37" rx="3"/><text class="tx-khuon" x="1130" y="484">&#171;module&#187;</text><text class="tx-lop-ten" x="1130" y="499">ml_service/db.py</text><line x1="1060" y1="507" x2="1200" y2="507"/><text class="tx-lop" x="1071" y="519">− engine: SQLAlchemy</text><line x1="1060" y1="529" x2="1200" y2="529"/><text class="tx-lop pt" x="1071" y="541">+ doc_sql(sql, tham_so)</text><text class="tx-lop pt" x="1071" y="557">+ ghi(sql, tham_so)</text></g><g class="qh-lop-g"><polyline class="lk-dut" points="214,140 460,140" fill="none" marker-end="url(#mui-lopB)"/><text class="tx-boi" x="337" y="132">HTTP JSON :8000</text></g><g class="qh-lop-g"><polyline class="lk-dut" points="635,130 790,130" fill="none" marker-end="url(#mui-lopB)"/></g><g class="qh-lop-g"><polyline class="lk-dut" points="547.5,225 546,300" fill="none" marker-end="url(#mui-lopB)"/></g><g class="qh-lop-g"><polyline class="lk-dut" points="460,150 440,150 440,510 460,510" fill="none" marker-end="url(#mui-lopB)"/></g><g class="qh-lop-g"><polyline class="lk-dut" points="460,180 450,180 450,632 860,632 860,567" fill="none" marker-end="url(#mui-lopB)"/></g><g class="qh-lop-g"><polyline class="lk-dut" points="969,130 1060,130" fill="none" marker-end="url(#mui-lopB)"/></g><g class="qh-lop-g"><polyline class="lk-dut" points="879.5,203 868.5,300" fill="none" marker-end="url(#mui-lopB)"/><text class="tx-boi" x="941.5" y="227">sinh đặc trưng</text></g><g class="qh-lop-g"><polyline class="lk-dut" points="930,520 1060,520" fill="none" marker-end="url(#mui-lopB)"/></g><g class="qh-lop-g"><polyline class="lk-dut" points="632,424 1035,424 1035,470" fill="none" marker-end="url(#mui-lopB)"/></g><g class="qh-lop-g"><polyline class="lk-dut" points="606,600 1020,600 1020,567" fill="none" marker-end="url(#mui-lopB)"/></g><g class="qh-lop-g"><polyline class="lk-dut" points="969,180 1046,180 1046,470" fill="none" marker-end="url(#mui-lopB)"/><text class="tx-boi" x="1150" y="400">lưu dự báo và chỉ số</text></g><g class="ghi-chu">
    <text class="tx-ghi" x="30" y="690">Hai tiến trình chỉ nói chuyện với nhau qua HTTP JSON, không dùng chung bộ nhớ. mlService luôn đặt hạn 30 giây và bắt lỗi:</text><text class="tx-ghi" x="30" y="703">khi tiến trình Python tắt, tầng web vẫn chạy bình thường và hiển thị kết quả đã lưu trong cơ sở dữ liệu của lần chạy trước.</text>
  </g></svg>