" width="137" height="91" rx="3"/><rect class="ngan-ten" x="1020" y="520" width="137" height="37" rx="3"/><text class="tx-khuon" x="1088.5" y="534">&#171;module&#187;</text><text class="tx-lop-ten" x="1088.5" y="549">chotCaService</text><line x1="1020" y1="557" x2="1157" y2="557"/><text class="tx-lop pt" x="1031" y="569">+ tongHopCa(nv, moc)</text><text class="tx-lop pt" x="1031" y="585">+ chotCa(input, nv)</text><text class="tx-lop pt" x="1031" y="601">+ duyetBienBan(id, nv)</text></g><g class="lop "><rect class="vien" x="30" y="737" width="205" height="113" rx="3"/><rect class="ngan-ten" x="30" y="737" width="205" height="37" rx="3"/><text class="tx-khuon" x="132.5" y="751">&#171;tiến trình nền&#187;</text><text class="tx-lop-ten" x="132.5" y="766">reservationJobs</text><line x1="30" y1="774" x2="235" y2="774"/><text class="tx-lop" x="41" y="786">+ CHU_KY_MS = 60000</text><line x1="30" y1="796" x2="235" y2="796"/><text class="tx-lop pt" x="41" y="808">+ quetNoShow() → dv.doiTrangThai()</text><text class="tx-lop pt" x="41" y="824">+ quetCocQuaHan() → huỷ, nhả bàn</text><text class="tx-lop pt" x="41" y="840">+ quetNhacLich() → gửi email nhắc</text></g><g class="qh-lop-g"><polyline class="lk-dut" points="70,147 70,230" fill="none" marker-end="url(#mui-lopC)"/><text class="tx-boi" x="106" y="192.5">«use»</text></g><g class="qh-lop-g"><polyline class="lk-dut" points="400,131 400,230" fill="none" marker-end="url(#mui-lopC)"/><text class="tx-boi" x="436" y="184.5">«use»</text></g><g class="qh-lop-g"><polyline class="lk-dut" points="730,131 730,230" fill="none" marker-end="url(#mui-lopC)"/><text class="tx-boi" x="766" y="184.5">«use»</text></g><g class="qh-lop-g"><polyline class="lk-dut" points="1060,131 1060,230" fill="none" marker-end="url(#mui-lopC)"/><text class="tx-boi" x="1096" y="184.5">«use»</text></g><g class="qh-lop-g"><polyline class="lk-dut" points="70,423 70,500" fill="none" marker-end="url(#mui-lopC)"/><text class="tx-boi" x="112" y="465.5">hỏi luật</text></g><g class="qh-lop-g"><polyline class="lk-dut" points="223,300 330,300 330,560 360,560" fill="none" marker-end="url(#mui-lopC)"/><text class="tx-boi" x="302" y="292">xếp bàn</text></g><g class="qh-lop-g"><polyline class="lk-dut" points="400,423 400,476 182,476 182,500" fill="none" marker-end="url(#mui-lopC)"/><text class="tx-boi" x="470" y="470">dùng chung luật</text></g><g class="qh-lop-g"><polyline class="lk-dut" points="70,737 70,677" fill="none" marker-end="url(#mui-lopC)"/><text class="tx-boi" x="140" y="711">mỗi phút một nhịp</text></g><g class="qh-lop-g"><polyline class="lk-dut" points="750,520 750,369" fill="none" marker-end="url(#mui-lopC)"/><text class="tx-boi" x="806" y="448.5">trừ lô FIFO</text></g><g class="qh-lop-g"><polyline class="lk-dut" points="1080,520 1080,375" fill="none" marker-end="url(#mui-lopC)"/><text class="tx-boi" x="1170" y="451.5">phiếu tiền mặt trong ca</text></g><g class="ghi-chu">
    <text class="tx-ghi" x="30" y="884">reservationRules không truy cập trạng thái phiên hay request: mọi hàm là hàm thuần (trừ docCauHinh), nên trang cấu hình của quản lý và tầng tạo lượt đặt</text><text class="tx-ghi" x="30" y="897">dùng CHUNG một cách tính tiền cọc / hoàn tiền. Mọi module dịch vụ trên hình đều truy vấn qua pool config/db (không vẽ để tránh rối).</text>
  </g></svg>