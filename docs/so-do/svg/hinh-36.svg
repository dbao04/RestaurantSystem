    </marker>
  </defs><g class="lop "><rect class="vien" x="30" y="40" width="217" height="107" rx="3"/><rect class="ngan-ten" x="30" y="40" width="217" height="37" rx="3"/><text class="tx-khuon" x="138.5" y="54">&#171;router&#187;</text><text class="tx-lop-ten" x="138.5" y="69">routes/datBan.js</text><line x1="30" y1="77" x2="247" y2="77"/><text class="tx-lop pt" x="41" y="89">+ POST /api/dat-ban</text><text class="tx-lop pt" x="41" y="105">+ POST /api/dat-ban/tra-cuu/doi-lich</text><text class="tx-lop pt" x="41" y="121">+ POST /api/reservations/walk-in</text><text class="tx-lop pt" x="41" y="137">+ POST /api/reservations/:id/deposit</text></g><g class="lop "><rect class="vien" x="360" y="40" width="245" height="91" rx="3"/><rect class="ngan-ten" x="360" y="40" width="245" height="37" rx="3"/><text class="tx-khuon" x="482.5" y="54">&#171;router&#187;</text><text class="tx-lop-ten" x="482.5" y="69">routes/datTiec.js</text><line x1="360" y1="77" x2="605" y2="77"/><text class="tx-lop pt" x="371" y="89">+ POST /api/dat-tiec</text><text class="tx-lop pt" x="371" y="105">+ POST /api/staff/dat-tiec/:id/trang-thai</text><text class="tx-lop pt" x="371" y="121">+ POST /api/staff/dat-tiec/:id/thanh-toan</text></g><g class="lop "><rect class="vien" x="690" y="40" width="226" height="91" rx="3"/><rect class="ngan-ten" x="690" y="40" width="226" height="37" rx="3"/><text class="tx-khuon" x="803" y="54">&#171;router&#187;</text><text class="tx-lop-ten" x="803" y="69">routes/khoBep.js</text><line x1="690" y1="77" x2="916" y2="77"/><text class="tx-lop pt" x="701" y="89">+ POST /api/kitchen/kho/nhap</text><text class="tx-lop pt" x="701" y="105">+ POST /api/kitchen/kho/xuat</text><text class="tx-lop pt" x="701" y="121">+ POST /api/kitchen/mua-hang/:id/:buoc</text></g><g class="lop "><rect class="vien" x="1020" y="40" width="231" height="91" rx="3"/><rect class="ngan-ten" x="1020" y="40" width="231" height="37" rx="3"/><text class="tx-khuon" x="1135.5" y="54">&#171;router&#187;</text><text class="tx-lop-ten" x="1135.5" y="69">routes/thuChi.js</text><line x1="1020" y1="77" x2="1251" y2="77"/><text class="tx-lop pt" x="1031" y="89">+ GET /staff/thu-chi</text><text class="tx-lop pt" x="1031" y="105">+ POST /api/staff/thu-chi/phieu</text><text class="tx-lop pt" x="1031" y="121">+ POST /api/staff/thu-chi/phieu/:id/huy</text></g><g class="lop "><rect class="vien" x="30" y="230" width="193" height="193" rx="3"/><rect class="ngan-ten" x="30" y="230" width="193" height="37" rx="3"/><text class="tx-khuon" x="126.5" y="244">&#171;module&#187;</text><text class="tx-lop-ten" x="126.5" y="259">reservationService</text><line x1="30" y1="267" x2="223" y2="267"/><text class="tx-lop" x="41" y="279">− COT_RSV: string</text><line x1="30" y1="289" x2="223" y2="289"/><text class="tx-lop pt" x="41" y="301">+ taoLuotDat(input, ctx)</text><text class="tx-lop pt" x="41" y="317">+ taoWalkIn(input, ctx)</text><text class="tx-lop pt" x="41" y="333">+ capNhat(id, input, ctx)</text><text class="tx-lop pt" x="41" y="349">+ capNhatMonDatTruoc(id, items)</text><text class="tx-lop pt" x="41" y="365">+ ganBan(id, dsBanId)</text><text class="tx-lop pt" x="41" y="381">+ doiTrangThai(id, moi, ctx)</text><text class="tx-lop pt" x="41" y="397">+ luuCoc(id, input)</text><text class="tx-lop pt" x="41" y="413">+ xemTruocHuy(id)</text></g><g class="lop "><rect class="vien" x="360" y="230" width="213" height="193" rx="3"/><rect class="ngan-ten" x="360" y="230" width="213" height="37" rx="3"/><text class="tx-khuon" x="466.5" y="244">&#171;module&#187;</text><text class="tx-lop-ten" x="466.5" y="259">datTiecService</text><line x1="360" y1="267" x2="573" y2="267"/><text class="tx-lop" x="371" y="279">+ CHUYEN_TRANG_THAI: map</text><text class="tx-lop" x="371" y="295">+ GIU_CHO: [DA_XAC_NHAN, DA_COC]</text><line x1="360" y1="305" x2="573" y2="305"/><text class="tx-lop pt" x="371" y="317">+ taoDonTiec(body, ctx)</text><text class="tx-lop pt" x="371" y="333">+ tinhDuToan(...)</text><text class="tx-lop pt" x="