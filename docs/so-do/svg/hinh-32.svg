olyline class="luong " points="697,1080 875,1080 875,490 774.5,490" marker-end="url(#mui-hdA)"/><text class="tx-luong" x="785" y="1072">bị giữ mất → xếp lại</text><polyline class="luong " points="665,1106 665,1154" marker-end="url(#mui-hdA)"/><text class="tx-luong" x="695" y="1132">đã ghi</text><polyline class="luong " points="633,1180 306,1180" marker-end="url(#mui-hdA)"/><text class="tx-luong" x="515" y="1172">có</text><polyline class="luong " points="215,1202 215,1270 557,1270" marker-end="url(#mui-hdA)"/><polyline class="luong " points="665,1292 665,1334" marker-end="url(#mui-hdA)"/><polyline class="luong " points="697,1180 855,1180 855,1360 697,1360" marker-end="url(#mui-hdA)"/><text class="tx-luong" x="795" y="1172">miễn cọc</text><polyline class="luong " points="665,1386 665,1417" marker-end="url(#mui-hdA)"/><polyline class="luong " points="505,1423 215,1423 215,1478" marker-end="url(#mui-hdA)"/><polyline class="luong " points="825,1423 1110,1423 1110,1478" marker-end="url(#mui-hdA)"/><polyline class="luong " points="215,1522 215,1588" marker-end="url(#mui-hdA)"/><polyline class="luong " points="1110,1522 1110,1578" marker-end="url(#mui-hdA)"/><polyline class="luong " points="1110,1622 1110,1658" marker-end="url(#mui-hdA)"/><g class="ghi-chu">
    <text class="tx-ghi" x="20" y="1674">Mọi kiểm tra ở làn Hệ thống chạy trên máy chủ, không chỉ trên trình duyệt; tiền cọc tính từ giá món trong thực đơn, không tin số tiền trình duyệt gửi.</text><text class="tx-ghi" x="20" y="1687">Hai khách cùng giữ một bàn: CSDL chặn trùng ở reservation_slot_locks, hệ thống tự xếp bàn khác tối đa 3 lần. Lượt quá hạn cọc hoặc không đến</text><text class="tx-ghi" x="20" y="1700">sau thời gian giữ bàn được vòng quét nền tự huỷ / đánh dấu no-show.</text>
  </g></svg>