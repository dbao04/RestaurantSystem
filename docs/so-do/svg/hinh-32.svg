    </g><g class="hd tu-dong">
      <rect x="535" y="231" width="260" height="58" rx="13"/>
      <text class="tx-viec" x="665" y="250.5">Kiểm tra: không ở quá khứ, không quá xa,</text><text class="tx-viec" x="665" y="264.5">trong giờ mở cửa, không sát giờ,</text><text class="tx-viec" x="665" y="278.5">SĐT không bị chặn, chưa vượt ngưỡng no-show</text>
    </g><g class="hd tu-dong">
      <rect x="555.5" y="461" width="219" height="58" rx="13"/>
      <text class="tx-viec" x="665" y="480.5">Bước 3: xếp bàn tự động theo quy mô</text><text class="tx-viec" x="665" y="494.5">và khu vực, ghép bàn khi cần</text><text class="tx-viec" x="665" y="508.5">(hoặc giữ bàn khách chọn trên sơ đồ)</text>
    </g><g class="hd tu-dong">
      <rect x="532" y="784" width="266" height="100" rx="13"/>
      <text class="tx-viec" x="665" y="803.5">Tính tiền cọc theo chính sách:</text><text class="tx-viec" x="665" y="817.5">đặt món trước → 100% tiền món</text><text class="tx-viec" x="665" y="831.5">đoàn ≥ ngưỡng tiệc (cấu hình, đang là 10)</text><text class="tx-viec" x="665" y="845.5">→ tối thiểu 150.000đ / khách</text><text class="tx-viec" x="665" y="859.5">giờ cao điểm hoặc ≥ 6 khách → 100.000đ / khách</text><text class="tx-viec" x="665" y="873.5">các trường hợp còn lại → miễn cọc</text>
    </g><g class="hd tu-dong">
      <rect x="552" y="931" width="226" height="58" rx="13"/>
      <text class="tx-viec" x="665" y="950.5">Một giao dịch CSDL: ghi reservations,</text><text class="tx-viec" x="665" y="964.5">khoá ô reservation_slot_locks,</text><text class="tx-viec" x="665" y="978.5">món đặt trước, lịch sử trạng thái</text>
    </g><g class="hd tu-dong">
      <rect x="557" y="1248" width="216" height="44" rx="13"/>
      <text class="tx-viec" x="665" y="1267.5">Webhook ngân hàng đối soát nội dung</text><text class="tx-viec" x="665" y="1281.5">chuyển khoản → cọc PAID</text>
    </g><g class="hd ">
      <rect x="1025.5" y="138" width="169" height="44" rx="13"/>
      <text class="tx-viec" x="1110" y="157.5">Nhận đặt bàn qua điện thoại</text><text class="tx-viec" x="1110" y="171.5">hoặc khách đến trực tiếp</text>
    </g><g class="hd ">
      <rect x="996" y="1478" width="228" height="44" rx="13"/>
      <text class="tx-viec" x="1110" y="1497.5">Xác nhận lượt đặt</text><text class="tx-viec" x="1110" y="1511.5">(PENDING → CONFIRMED) hoặc từ chối</text>
    </g><g class="hd ">
      <rect x="999.5" y="1578" width="221" height="44" rx="13"/>
      <text class="tx-viec" x="1110" y="1597.5">Đón khách, xếp vào bàn</text><text class="tx-viec" x="1110" y="1611.5">(ARRIVED → SEATED → COMPLETED)</text>
    </g><g class="qd">
