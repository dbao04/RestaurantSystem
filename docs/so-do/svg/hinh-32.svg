  </g><g class="nut-dau"><circle cx="215" cy="90" r="10"/></g><g class="nut-dau"><circle cx="1110" cy="90" r="10"/></g><g class="hd ">
      <rect x="122.5" y="138" width="185" height="44" rx="13"/>
      <text class="tx-viec" x="215" y="157.5">Bước 1: đọc chính sách đặt cọc</text><text class="tx-viec" x="215" y="171.5">và hoàn huỷ, tích “Tôi đồng ý”</text>
    </g><g class="hd ">
      <rect x="129.5" y="238" width="171" height="44" rx="13"/>
      <text class="tx-viec" x="215" y="257.5">Bước 2: chọn ngày, giờ đến,</text><text class="tx-viec" x="215" y="271.5">số khách, khu vực mong muốn</text>
    </g><g class="hd ">
      <rect x="133.5" y="358" width="163" height="44" rx="13"/>
      <text class="tx-viec" x="215" y="377.5">Xem lý do bị từ chối,</text><text class="tx-viec" x="215" y="391.5">chọn lại ngày giờ / khu vực</text>
    </g><g class="hd ">
      <rect x="125" y="578" width="180" height="44" rx="13"/>
      <text class="tx-viec" x="215" y="597.5">Xem khung giờ và khu vực</text><text class="tx-viec" x="215" y="611.5">còn trống được gợi ý thay thế</text>
    </g><g class="hd ">
      <rect x="115" y="698" width="200" height="44" rx="13"/>
      <text class="tx-viec" x="215" y="717.5">Bước 4: gọi món trước (tuỳ chọn),</text><text class="tx-viec" x="215" y="731.5">được đổi món tới hạn chốt</text>
    </g><g class="hd ">
      <rect x="120.5" y="808" width="189" height="44" rx="13"/>
      <text class="tx-viec" x="215" y="827.5">Bước 5: nhập họ tên, SĐT, email,</text><text class="tx-viec" x="215" y="841.5">dịp đặc biệt, yêu cầu riêng</text>
    </g><g class="hd ">
      <rect x="124" y="1158" width="182" height="44" rx="13"/>
      <text class="tx-viec" x="215" y="1177.5">Quét mã VietQR, chuyển khoản</text><text class="tx-viec" x="215" y="1191.5">trước hạn nộp cọc</text>
    </g><g class="hd ">
      <rect x="105" y="1478" width="220" height="44" rx="13"/>
