    <text class="tx-ghi" x="26" y="696">Thứ tự hai kiểm tra là có chủ đích: vị trí kiểm trước, khuôn mặt kiểm sau. Người chấm công từ xa bị chặn</text><text class="tx-ghi" x="26" y="709">trong một phần giây mà hệ thống không cần biết người đó là ai, và không tốn một lượt gọi dịch vụ nhận diện.</text>
