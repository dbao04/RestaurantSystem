            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="mui-rong-lopA" viewBox="0 0 12 12" refX="11" refY="6"
            markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="none" stroke="currentColor" stroke-width="1.4"/>
    </marker>
  </defs><g class="lop "><rect class="vien" x="30" y="40" width="170" height="113" rx="3"/><rect class="ngan-ten" x="30" y="40" width="170" height="37" rx="3"/><text class="tx-khuon" x="115" y="54">&#171;router&#187;</text><text class="tx-lop-ten" x="115" y="69">server.js</text><line x1="30" y1="77" x2="200" y2="77"/><text class="tx-lop" x="41" y="89">− io: Server</text><line x1="30" y1="99" x2="200" y2="99"/><text class="tx-lop pt" x="41" y="111">+ GET /qr/table/:tableId</text><text class="tx-lop pt" x="41" y="127">+ POST /qr/add-dish</text><text class="tx-lop pt" x="41" y="143">+ GET /qr/table/:tableId/don</text></g><g class="lop "><rect class="vien" x="330" y="40" width="173" height="91" rx="3"/><rect class="ngan-ten" x="330" y="40" width="173" height="37" rx="3"/><text class="tx-khuon" x="416.5" y="54">&#171;router&#187;</text><text class="tx-lop-ten" x="416.5" y="69">routes/kds.js</text><line x1="330" y1="77" x2="503" y2="77"/><text class="tx-lop pt" x="341" y="89">+ GET /kds/api/don</text><text class="tx-lop pt" x="341" y="105">+ POST /kds/api/:buoc/:id</text><text class="tx-lop pt" x="341" y="121">+ GET /so-do-ban/api/du-lieu</text></g><g class="lop "><rect class="vien" x="650" y="40" width="231" height="91" rx="3"/><rect class="ngan-ten" x="650" y="40" width="231" height="37" rx="3"/><text class="tx-khuon" x="765.5" y="54">&#171;router&#187;</text><text class="tx-lop-ten" x="765.5" y="69">routes/thanhToan.js</text><line x1="650" y1="77" x2="881" y2="77"/><text class="tx-lop pt" x="661" y="89">+ POST /qr/thanh-toan/:sesis/tao-phien</text><text class="tx-lop pt" x="661" y="105">+ POST /api/webhook/ngan-hang</text><text class="tx-lop pt" x="661" y="121">+ GET /staff/thanh-toan/:sesis</text></g><g class="lop "><rect class="vien" x="1030" y="40" width="147" height="75" rx="3"/><rect class="ngan-ten" x="1030" y="40" width="147" height="37" rx="3"/><text class="tx-khuon" x="1103.5" y="54">&#171;router&#187;</text><text class="tx-lop-ten" x="1103.5" y="69">routes/analytics.js</text><line x1="1030" y1="77" x2="1177" y2="77"/><text class="tx-lop pt" x="1041" y="89">+ GET /analytics</text><text class="tx-lop pt" x="1041" y="105">+ GET /analytics/api/*</text></g><g class="lop "><rect class="vien" x="30" y="250" width="234" height="161" rx="3"/><rect class="ngan-ten" x="30" y="250" width="234" height="37" rx="3"/><text class="tx-khuon" x="147" y="264">&#171;module&#187;</text><text class="tx-lop-ten" x="147" y="279">orderService</text><line x1="30" y1="287" x2="264" y2="287"/><text class="tx-lop" x="41" y="299">− MAT_KHAU_VO_HIEU: string</text><line x1="30" y1="309" x2="264" y2="309"/><text class="tx-lop pt" x="41" y="321">+ layBanQR(tableId)</text><text class="tx-lop pt" x="41" y="337">+ phienDangMoCuaBan(tableId)</text><text class="tx-lop pt" x="41" y="353">+ createQROrder(tableId)</text><text class="tx-lop pt" x="41" y="369">+ addMultipleDishesToOrder(sesis, items)</text><text class="tx-lop pt" x="41" y="385">+ donCuaBanQR(tableId)</text><text class="tx-lop pt" x="41" y="401">+ createOrderFromCart(...)</text></g><g class="lop "><rect class="vien" x="330" y="250" width="184" height="161" rx="3"/><rect class="ngan-ten" x="330" y="250" width="184" height="37" rx="3"/><text class="tx-khuon" x="422" y="264">&#171;module&#187;</text><text class="tx-lop-ten" x="422" y="279">kdsService</text><line x1="330" y1="287" x2="514" y2="287"/><text class="tx-lop" x="341" y="299">+ TEN_TRANG_THAI_BEP: {0..3}</text><text class="tx-lop" x="341" y="315">+ TEN_TRANG_THAI_BAN: {0..3}</text><line x1="330" y1="325" x2="514" y2="325"/><text class="tx-lop pt" x="341" y="337">+ layDonBep()</text><text class="tx-lop pt" x="341" y="353">+ batDauCheBien(id)</text><text class="tx-lop pt" x="341" y="369">+ hoanThanhCheBien(id)</text><text class="tx-lop pt" x="341" y="385">+ danhDauDaPhucVu(id)</text><text class="tx-lop pt" x="341" y="401">+ laySoDoBan()</text></g><g class="lop "><rect class="vien" x="650" y="250" width="240" height="145" rx="3"/><rect class="ngan-ten" x="650" y="250" width="240" height="37" rx="3"/><text class="tx-khuon" x="770" y="264">&#171;module&#187;</text><text class="tx-lop-ten" x="770" y="279">thanhToanService</text><line x1="650" y1="287" x2="890" y2="287"/><text class="tx-lop" x="661" y="299">− cauHinh: object</text><line x1="650" y1="309" x2="890" y2="309"/><text class="tx-lop pt" x="661" y="321">+ taoPhien({sesis, soTien, maPhuongThuc})</text><text class="tx-lop pt" x="661" y="337">+ ghiNhanGiaoDichNganHang(gd)</text><text class="tx-lop pt" x="661" y="353">+ layHoaDon(sesis, opts)</text><text class="tx-lop pt" x="661" y="369">+ xacNhan(id) / huyPhien(id)</text><text class="tx-lop pt" x="661" y="385">− sinhMaDoiSoat()</text></g><g class="lop "><rect class="vien" x="1030" y="250" width="147" height="107" rx="3"/><rect class="ngan-ten" x="1030" y="250" width="147" height="37" rx="3"/><text class="tx-khuon" x="1103.5" y="264">&#171;module&#187;</text><text class="tx-lop-ten" x="1103.5" y="279">analyticsService</text><line x1="1030" y1="287" x2="1177" y2="287"/><text class="tx-lop pt" x="1041" y="299">+ khoangNgay(tu, den)</text><text class="tx-lop pt" x="1041" y="315">+ tongQuan(tu, den)</text><text class="tx-lop pt" x="1041" y="331">+ doanhThuTheoNgay(...)</text><text class="tx-lop pt" x="1041" y="347">+ topMonBanChay(...)</text></g><g class="lop "><rect class="vien" x="30" y="520" width="161" height="107" rx="3"/><rect class="ngan-ten" x="30" y="520" width="161" height="37" rx="3"/><text class="tx-khuon" x="110.5" y="534">&#171;module&#187;</text><text class="tx-lop-ten" x="110.5" y="549">menuService</text><line x1="30" y1="557" x2="191" y2="557"/><text class="tx-lop pt" x="41" y="569">+ getAllCategories()</text><text class="tx-lop pt" x="41" y="585">+ getDishesByCategory(id)</text><text class="tx-lop pt" x="41" y="601">+ getRecipeByDish(idMon)</text><text class="tx-lop pt" x="41" y="617">+ addStockIn(phieu)</text></g><g class="lop "><rect class="vien" x="650" y="560" width="136" height="97" rx="3"/><rect class="ngan-ten" x="650" y="560" width="136" height="37" rx="3"/><text class="tx-khuon" x="718" y="574">&#171;module&#187;</text><text class="tx-lop-ten" x="718" y="589">vietQR</text><line x1="650" y1="597" x2="786" y2="597"/><text class="tx-lop" x="661" y="609">+ nganHang: map 40+ mã</text><line x1="650" y1="619" x2="786" y2="619"/><text class="tx-lop pt" x="661" y="631">+ tlv(id, giaTri)</text><text class="tx-lop pt" x="661" y="647">+ noiDung(sesis)</text></g><g class="lop "><rect class="vien" x="330" y="560" width="132" height="97" rx="3"/><rect class="ngan-ten" x="330" y="560" width="132" height="37" rx="3"/><text class="tx-khuon" x="396" y="574">&#171;module&#187;</text><text class="tx-lop-ten" x="396" y="589">realtime</text><line x1="330" y1="597" x2="462" y2="597"/><text class="tx-lop" x="341" y="609">− io: Server</text><line x1="330" y1="619" x2="462" y2="619"/><text class="tx-lop pt" x="341" y="631">+ phat(sesis, sk, dl)</text><text class="tx-lop pt" x="341" y="647">+ phong(nv)</text></g><g class="lop "><rect class="vien" x="1030" y="560" width="132" height="97" rx="3"/><rect class="ngan-ten" x="1030" y="560" width="132" height="37" rx="3"/><text class="tx-khuon" x="1096" y="574">&#171;singleton&#187;</text><text class="tx-lop-ten" x="1096" y="589">config/db</text><line x1="1030" y1="597" x2="1162" y2="597"/><text class="tx-lop" x="1041" y="609">− pool: mysql2.Pool</text><line x1="1030" y1="619" x2="1162" y2="619"/><text class="tx-lop pt" x="1041" y="631">+ query(sql, tham_so)</text><text class="tx-lop pt" x="1041" y="647">+ getConnection()</text></g><g class="qh-lop-g"><polyline class="lk-dut" points="115,153 147,250" fill="none" marker-end="url(#mui-lopA)"/><text class="tx-boi" x="173" y="201.5">«use»</text></g><g class="qh-lop-g"><polyline class="lk-dut" points="416.5,131 422,250" fill="none" marker-end="url(#mui-lopA)"/><text class="tx-boi" x="461.25" y="190.5">«use»</text></g><g class="qh-lop-g"><polyline class="lk-dut" points="765.5,131 770,250" fill="none" marker-end="url(#mui-lopA)"/><text class="tx-boi" x="809.75" y="190.5">«use»</text></g><g class="qh-lop-g"><polyline class="lk-dut" points="1103.5,115 1103.5,250" fill="none" marker-end="url(#mui-lopA)"/><text class="tx-boi" x="1145.5" y="182.5">«use»</text></g><g class="qh-lop-g"><polyline class="lk-dut" points="1103.5,357 1103.5,560" fill="none" marker-end="url(#mui-lopA)"/></g><g class="qh-lop-g"><polyline class="lk-dut" points="890,370 1000,370 1000,560" fill="none" marker-end="url(#mui-lopA)"/></g><g class="qh-lop-g"><polyline class="lk-dut" points="191,540 1012,540 1012,560" fill="none" marker-end="url(#mui-lopA)"/></g><g class="qh-lop-g"><polyline class="lk-dut" points="30,380 12,380 12,700 1060,700 1060,657" fill="none" marker-end="url(#mui-lopA)"/></g><text class="tx-boi" x="600" y="692">mọi truy vấn SQL đều đi qua một pool duy nhất</text><g class="qh-lop-g"><polyline class="qh-lop" points="770,395 718,560" fill="none"/><polygon class="thoi dac" points="770,395 761.8728323699422,400.8265895953757 765.1907514450867,410.26011560693644 773.3179190751446,404.43352601156073"/><text class="tx-boi" x="832" y="421">sinh mã QR</text></g><g class="qh-lop-g"><polyline class="qh-lop" points="422,411 396,560" fill="none"/><polygon class="thoi " points="422,411 414.7141192554079,417.84952128075986 419.2496130764516,426.76183275418106 426.5354938210437,419.91231147342114"/><text class="tx-boi" x="484" y="445">phát sự kiện</text></g><g class="qh-lop-g"><polyline class="lk-dut" points="147,411 110.5,520" fill="none" marker-end="url(#mui-lopA)"/><text class="tx-boi" x="187" y="437">«use»</text></g><g class="ghi-chu">
    <text class="tx-ghi" x="30" y="745">Toàn bộ câu lệnh SQL nằm ở tầng dịch vụ. Tầng định tuyến chỉ nhận tham số, kiểm tra quyền rồi gọi xuống — nhờ ranh giới này,</text><text class="tx-ghi" x="30" y="758">đổi một câu truy vấn hay đổi cả lược đồ bảng chỉ phải sửa trong services/ mà không lần theo hàng nghìn dòng ở tầng trên.</text>
  </g></svg>