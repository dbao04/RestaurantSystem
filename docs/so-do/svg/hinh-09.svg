            markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="none" stroke="currentColor" stroke-width="1.4"/>
    </marker>
  </defs><g class="sk sk-dau"><circle cx="60" cy="46" r="19"/><text class="tx-sk" x="60" y="80">Bắt đầu</text></g><g class="sk sk-giua"><circle cx="220" cy="46" r="19"/><circle cx="220" cy="46" r="15"/><path class="thu" d="M212,41 h16 v10 h-16 z M212,41 l8,6 l8,-6"/><text class="tx-sk" x="220" y="80">Trung gian</text></g><g class="sk sk-cuoi"><circle cx="380" cy="46" r="19"/><text class="tx-sk" x="380" y="80">Kết thúc</text></g><g class="viec ">
    <rect x="491" y="19" width="138" height="54" rx="7"/>
    
    <text class="tx-viec" x="560" y="50.5">Công việc của người</text>
  </g><g class="viec tu-dong">
    <rect x="691" y="19" width="138" height="54" rx="7"/>
    <g class="bt"><rect x="697" y="25" width="11" height="11" rx="1.5"/>
       <line x1="699.5" y1="28" x2="705.5" y2="28"/>
       <line x1="699.5" y1="30.5" x2="705.5" y2="30.5"/></g>
    <text class="tx-viec" x="760" y="50.5">Bước hệ thống tự chạy</text>
  </g><g class="cong">
    <polygon points="940,22 964,46 940,70 916,46"/>
    <line x1="932" y1="38" x2="948" y2="54"/>
    <line x1="932" y1="54" x2="948" y2="38"/>
    <text class="tx-sk" x="940" y="14">Rẽ nhánh loại trừ</text>
  </g><polyline class="luong " points="1010,46 1120,46" marker-end="url(#mui-cg2)"/><text class="tx-sk" x="1065" y="72">luồng trình tự</text></svg>