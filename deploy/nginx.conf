# nginx dung truoc web Node (cong 3000). __TEN_MIEN__ duoc cai-dat-vps.sh thay.
# certbot tu them phan HTTPS (cong 443) va chuyen huong http -> https.
server {
    listen 80;
    server_name __TEN_MIEN__ www.__TEN_MIEN__;

    # Anh mon an, anh chat, anh cham cong khuon mat.
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Socket.IO (bep, thu ngan, theo doi giao hang realtime) can WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Node tin cac header nay vi TRUST_PROXY mac dinh = loopback (nginx cung may).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
